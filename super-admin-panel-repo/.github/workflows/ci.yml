name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: super-admin-panel-repo/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: super-admin-panel-repo

      - name: Typecheck
        run: npm run typecheck
        working-directory: super-admin-panel-repo

      - name: Lint
        run: npm run lint
        working-directory: super-admin-panel-repo

      - name: Unit tests
        run: npm run test
        working-directory: super-admin-panel-repo

      - name: Build
        run: npm run build
        working-directory: super-admin-panel-repo

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: super-admin-panel-repo/dist
          retention-days: 7

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: ci
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: super-admin-panel-repo/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: super-admin-panel-repo

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: super-admin-panel-repo

      - name: Run E2E tests
        run: npm run test:e2e
        working-directory: super-admin-panel-repo
        env:
          # NOTE: E2E tests require the backend API to be running.
          # This workflow does NOT start the backend service.
          # Configure a separate backend service (e.g., via GitHub Actions services,
          # a deployed staging environment, or a local tunnel) and set VITE_API_URL
          # to point to it before running Playwright tests.
          # Example: VITE_API_URL=http://localhost:57800/api/v1
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
